<circle cx="362.6" cy="36" r="3.5" class="ok"/>
<text x="416" y="40" text-anchor="end" class="mono ok" font-size="11.5">Tayyor</text>
<text x="24" y="76" class="fg" font-size="19" font-weight="700" letter-spacing="-0.3">E-Commerce REST API</text>
<text x="24" y="96" class="mono mut" font-size="11.5">Scalable Store Engine</text>
<text x="24" y="128" class="mut" font-size="13.5">N+1 SQL muammolari hal qilingan, JWT</text><text x="24" y="149" class="mut" font-size="13.5">autentifikatsiyali va Swagger hujjatli to'liq REST API</text><text x="24" y="170" class="mut" font-size="13.5">xizmati.</text>
<line x1="24" x2="416" y1="200" y2="200" class="ln"/>
<text x="24" y="218" class="mono fg" font-size="11.5">Django / DRF / PostgreSQL / Docker / Swagger</text>
