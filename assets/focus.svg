<svg xmlns="http://www.w3.org/2000/svg" width="880" height="138" viewBox="0 0 880 138" role="img" aria-label="Asosiy yo'nalishlar"><title>Asosiy yo'nalishlar</title><style>
:root{--card:#f6f8fa;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--acc:#3b5bdb;--ok:#1a7f37;--wip:#9a6700;--ibg:#1f2328;--ifg:#ffffff}
@media (prefers-color-scheme:dark){:root{--card:#12171e;--fg:#e6edf3;--mut:#8d96a0;--line:#2d333b;--acc:#8ea3ff;--ok:#3fb950;--wip:#d29922;--ibg:#e6edf3;--ifg:#0d1117}}
text{font-family:-apple-system,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
.fg{fill:var(--fg)} .mut{fill:var(--mut)} .acc{fill:var(--acc)} .ok{fill:var(--ok)} .wip{fill:var(--wip)}
.card{fill:var(--card)} .ibg{fill:var(--ibg)} .ifg{fill:var(--ifg)}
.ln{stroke:var(--line);fill:none} .lnfill{fill:var(--line)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.f1{animation:fade .6s ease .2s backwards} .f2{animation:fade .6s ease .6s backwards}
.f3{animation:fade .6s ease 1s backwards} .f4{animation:fade .6s ease 1.4s backwards} .f5{animation:fade .6s ease 1.8s backwards}
.cur{animation:blink 1.1s steps(1) infinite}
</style><rect x="0" y="10" width="28" height="3" class="acc"/><text x="0" y="46" class="mono mut" font-size="12">01</text><text x="0" y="74" class="fg" font-size="17" font-weight="650">Clean Architecture</text><text x="0" y="96" class="mut" font-size="13.5">SOLID, modul tuzilma va toza</text><text x="0" y="115" class="mut" font-size="13.5">kod</text><rect x="225" y="10" width="28" height="3" class="acc"/><text x="225" y="46" class="mono mut" font-size="12">02</text><text x="225" y="74" class="fg" font-size="17" font-weight="650">Asinxron tizimlar</text><text x="225" y="96" class="mut" font-size="13.5">Asyncio, Celery va WebSockets</text><rect x="450" y="10" width="28" height="3" class="acc"/><text x="450" y="46" class="mono mut" font-size="12">03</text><text x="450" y="74" class="fg" font-size="17" font-weight="650">Ma'lumotlar bazasi</text><text x="450" y="96" class="mut" font-size="13.5">Indexing, pooling, query</text><text x="450" y="115" class="mut" font-size="13.5">tuning</text><rect x="675" y="10" width="28" height="3" class="acc"/><text x="675" y="46" class="mono mut" font-size="12">04</text><text x="675" y="74" class="fg" font-size="17" font-weight="650">AI / RAG / LLM</text><text x="675" y="96" class="mut" font-size="13.5">Gemini, LangChain, FAISS,</text><text x="675" y="115" class="mut" font-size="13.5">pgvector</text></svg>