<text x="440" y="160" class="mut f2" font-size="17">Java Core · Toza arxitektura</text>
<line x1="440" x2="440" y1="90" y2="172" class="ln"/>
<text x="0" y="266" class="mono mut" font-size="13.5"><tspan class="acc">$</tspan> python -m app.main</text>
<g class="f2"><circle cx="5" cy="292" r="3.5" class="ok"/><text x="20" y="296" class="mono mut" font-size="13.5">PostgreSQL</text><text x="210" y="296" class="mono fg" font-size="13.5">connected</text></g><g class="f3"><circle cx="5" cy="318" r="3.5" class="ok"/><text x="20" y="322" class="mono mut" font-size="13.5">Redis</text><text x="210" y="322" class="mono fg" font-size="13.5">active</text></g><g class="f4"><circle cx="5" cy="344" r="3.5" class="ok"/><text x="20" y="348" class="mono mut" font-size="13.5">FastAPI + Docker</text><text x="210" y="348" class="mono fg" font-size="13.5">running</text></g>
