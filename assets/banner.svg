<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-label="Bahromjon Sherqo'ziyev — Backend Software Engineer"><title>Bahromjon Sherqo'ziyev — Backend Software Engineer</title><style>
:root{--card:#f6f8fa;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--acc:#3b5bdb;--ok:#1a7f37;--wip:#9a6700;--ibg:#1f2328;--ifg:#ffffff}
@media (prefers-color-scheme:dark){:root{--card:#12171e;--fg:#e6edf3;--mut:#8d96a0;--line:#2d333b;--acc:#8ea3ff;--ok:#3fb950;--wip:#d29922;--ibg:#e6edf3;--ifg:#0d1117}}
text{font-family:-apple-system,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
.fg{fill:var(--fg)} .mut{fill:var(--mut)} .acc{fill:var(--acc)} .ok{fill:var(--ok)} .wip{fill:var(--wip)}
.card{fill:var(--card)} .ibg{fill:var(--ibg)} .ifg{fill:var(--ifg)}
.ln{stroke:var(--line);fill:none} .lnfill{fill:var(--line)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.f1{animation:fade .6s ease .2s backwards} .f2{animation:fade .6s ease .6s backwards}
.f3{animation:fade .6s ease 1s backwards} .f4{animation:fade .6s ease 1.4s backwards} .f5{animation:fade .6s ease 1.8s backwards}
.cur{animation:blink 1.1s steps(1) infinite}
</style>
<g class="f1">
  <text x="0" y="64" class="mono acc" font-size="12.5" letter-spacing="3">BACKEND ENGINEER</text>
  <text x="-2" y="132" class="fg" font-size="58" font-weight="700" letter-spacing="-1.8">Bahromjon</text>
  <text x="-2" y="192" class="fg" font-size="58" font-weight="700" letter-spacing="-1.8">Sherqo'ziyev</text>
</g>
<text x="440" y="108" class="mut f2" font-size="17">Python (Django, FastAPI)</text>
