<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Bahromjon Sherqo'ziyev — Backend Software Engineer"><title>Bahromjon Sherqo'ziyev — Backend Software Engineer</title>
<defs>

